<!DOCTYPE html>
<html>
<head>
    <title>GenLayer Execution Flow</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
    <!-- Title -->
    <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#8B5CF6">
        GenLayer Contract Execution Flow
    </text>
    
    <!-- User Submits -->
    <rect x="300" y="60" width="200" height="60" rx="10" fill="#A78BFA" stroke="#8B5CF6" stroke-width="2"/>
    <text x="400" y="85" font-size="14" font-weight="bold" text-anchor="middle" fill="white">User Submits</text>
    <text x="400" y="105" font-size="12" text-anchor="middle" fill="white">Transaction</text>
    
    <!-- Arrow -->
    <path d="M 400 120 L 400 150" stroke="#8B5CF6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Network -->
    <rect x="300" y="150" width="200" height="60" rx="10" fill="#A78BFA" stroke="#8B5CF6" stroke-width="2"/>
    <text x="400" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Transaction enters</text>
    <text x="400" y="195" font-size="12" text-anchor="middle" fill="white">GenLayer Network</text>
    
    <!-- Arrow -->
    <path d="M 400 210 L 400 240" stroke="#8B5CF6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Leader -->
    <rect x="300" y="240" width="200" height="60" rx="10" fill="#A78BFA" stroke="#8B5CF6" stroke-width="2"/>
    <text x="400" y="265" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Leader Validator</text>
    <text x="400" y="285" font-size="12" text-anchor="middle" fill="white">Selected</text>
    
    <!-- Decision Diamond -->
    <path d="M 400 320 L 500 380 L 400 440 L 300 380 Z" fill="#F9A8D4" stroke="#EC4899" stroke-width="2"/>
    <text x="400" y="375" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Need</text>
    <text x="400" y="390" font-size="12" font-weight="bold" text-anchor="middle" fill="white">AI/Web?</text>
    
    <!-- No Path -->
    <path d="M 300 380 L 200 380 L 200 500" stroke="#8B5CF6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="250" y="375" font-size="12" fill="#8B5CF6">No</text>
    
    <!-- Yes Path -->
    <path d="M 500 380 L 600 380 L 600 500" stroke="#8B5CF6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="550" y="375" font-size="12" fill="#8B5CF6">Yes</text>
    
    <!-- Fast Execution -->
    <rect x="100" y="500" width="200" height="60" rx="10" fill="#34D399" stroke="#10B981" stroke-width="2"/>
    <text x="200" y="525" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Execute</text>
    <text x="200" y="545" font-size="12" text-anchor="middle" fill="white">Normally (Fast)</text>
    
    <!-- AI Execution -->
    <rect x="500" y="500" width="200" height="60" rx="10" fill="#FBBF24" stroke="#F59E0B" stroke-width="2"/>
    <text x="600" y="525" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Execute with</text>
    <text x="600" y="545" font-size="12" text-anchor="middle" fill="white">AI Consensus</text>
    
    <!-- Merge -->
    <path d="M 200 560 L 200 600 L 400 600" stroke="#8B5CF6" stroke-width="2" fill="none"/>
    <path d="M 600 560 L 600 600 L 400 600" stroke="#8B5CF6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Compare Results -->
    <rect x="300" y="620" width="200" height="60" rx="10" fill="#A78BFA" stroke="#8B5CF6" stroke-width="2"/>
    <text x="400" y="645" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Results Compared</text>
    <text x="400" y="665" font-size="12" text-anchor="middle" fill="white">Across Validators</text>
    
    <!-- Arrow -->
    <path d="M 400 680 L 400 710" stroke="#8B5CF6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Final Decision -->
    <path d="M 400 710 L 500 770 L 400 830 L 300 770 Z" fill="#F9A8D4" stroke="#EC4899" stroke-width="2"/>
    <text x="400" y="775" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Match?</text>
    
    <!-- Success -->
    <path d="M 500 770 L 600 770 L 600 880" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="550" y="765" font-size="12" fill="#10B981">✓ Yes</text>
    
    <!-- Retry -->
    <path d="M 300 770 L 200 770" stroke="#EF4444" stroke-width="2" fill="none"/>
    <text x="250" y="765" font-size="12" fill="#EF4444">✗ No</text>
    <text x="150" y="785" font-size="10" fill="#EF4444">Re-execute</text>
    
    <!-- Finalized -->
    <rect x="500" y="880" width="200" height="60" rx="10" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <text x="600" y="905" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Transaction</text>
    <text x="600" y="925" font-size="12" text-anchor="middle" fill="white">Finalized ✓</text>
    
    <!-- Arrow marker definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="#8B5CF6"/>
        </marker>
    </defs>
    
    <!-- Legend -->
    <rect x="50" y="20" width="150" height="100" rx="5" fill="none" stroke="#D1D5DB" stroke-width="1"/>
    <text x="125" y="40" font-size="12" font-weight="bold" text-anchor="middle" fill="#6B7280">Legend</text>
    <rect x="60" y="50" width="30" height="15" rx="3" fill="#A78BFA"/>
    <text x="95" y="61" font-size="10" fill="#6B7280">Process</text>
    <rect x="60" y="70" width="30" height="15" rx="3" fill="#F9A8D4"/>
    <text x="95" y="81" font-size="10" fill="#6B7280">Decision</text>
    <rect x="60" y="90" width="30" height="15" rx="3" fill="#34D399"/>
    <text x="95" y="101" font-size="10" fill="#6B7280">Success</text>
</svg>
</body>
</html>
